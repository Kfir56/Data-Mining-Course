<div class="app" dir="rtl" lang="he">
  <header class="top">
    <div>
      <h1>מעבדת <span>למידה חישובית</span></h1>
      <p>כל אלגוריתם שמופיע במבחני הקורס, עם השאלות האמיתיות טעונות מראש. משנים מספר והחישוב מתעדכן מיד, שלב אחרי שלב.</p>

<script>
/* ===== Core math engine (no DOM) ===== */
const ML = (() => {
  const isPos = l => /^(p|1|\+1|\+|pos|positive|yes|y|כן|חיובי|משפיע)$/i.test(String(l).trim());
  const parseNum = s => {
    s = String(s).trim();
    if (/^-?\d+(\.\d+)?-$/.test(s)) s = '-' + s.slice(0, -1); // "1-" from RTL copy
    if (s.includes('/')) { const [a, b] = s.split('/'); return parseFloat(a) / parseFloat(b); }
    return parseFloat(s);
  };
  const rows = text => text.split('\n').map(l => l.trim()).filter(l => l && !l.startsWith('#') && !l.startsWith('//'))
    .map(l => l.replace(/[()\[\]]/g, ' ').split(/[\s,;\t]+/).filter(Boolean));
  const fmt = (x, d = 4) => {
    if (x === undefined || x === null || Number.isNaN(x)) return '—';
    if (!isFinite(x)) return x > 0 ? '∞' : '−∞';
    const r = +x.toFixed(d);
    return (Object.is(r, -0) ? 0 : r).toString().replace('-', '−');
  };
  const toFrac = (x, maxDen = 240) => {
    for (let q = 1; q <= maxDen; q++) { const p = Math.round(x * q); if (Math.abs(p / q - x) < 1e-9) return [p, q]; }
    return null;
  };
  const frac = x => { const f = toFrac(x); if (!f || f[1] === 1) return fmt(x); return `${f[0] < 0 ? '−' : ''}${Math.abs(f[0])}/${f[1]}`; };
  const mixed = x => {
    const f = toFrac(x); if (!f || f[1] === 1) return fmt(x);
    const s = f[0] < 0 ? '−' : ''; const p = Math.abs(f[0]), q = f[1];
    const w = Math.floor(p / q), r = p % q;
    return w ? `${s}${w} ${r}/${q}` : `${s}${r}/${q}`;
  };
  const log2 = x => Math.log(x) / Math.log(2);

  /* ---------- metrics ---------- */
  function metrics(TP, FN, FP, TN) {
    const N = TP + FN + FP + TN;
    const acc = (TP + TN) / N, prec = TP / (TP + FP), rec = TP / (TP + FN);
    const f1 = 2 * prec * rec / (prec + rec), fpr = FP / (FP + TN), spec = TN / (FP + TN);
    return { N, acc, prec, rec, f1, fpr, spec, tpr: rec };
  }

  /* ---------- ROC ---------- */
  function rocFromScores(items) { // items: [{s, pos}]
    const P = items.filter(i => i.pos).length, N = items.length - P;
    const sorted = [...items].sort((a, b) => b.s - a.s);
    const ths = [...new Set(sorted.map(i => i.s))];
    const pts = [{ x: 0, y: 0, t: Infinity, tp: 0, fp: 0 }];
    for (const t of ths) {
      const tp = sorted.filter(i => i.s >= t && i.pos).length, fp = sorted.filter(i => i.s >= t && !i.pos).length;
      pts.push({ x: fp / N, y: tp / P, t, tp, fp });
    }
    return { pts, P, N, sorted };
  }
  function auc(pts) { let a = 0; for (let i = 1; i < pts.length; i++) a += (pts[i].x - pts[i - 1].x) * (pts[i].y + pts[i - 1].y) / 2; return a; }
  function eer(pts) { // point where FPR = FNR = 1-TPR
    for (let i = 1; i < pts.length; i++) {
      const a = pts[i - 1], b = pts[i];
      const fa = a.x + a.y - 1, fb = b.x + b.y - 1;
      if (fa === 0) return { x: a.x, y: a.y };
      if (fa < 0 && fb >= 0) { const t = -fa / (fb - fa); return { x: a.x + t * (b.x - a.x), y: a.y + t * (b.y - a.y) }; }
    }
    const l = pts[pts.length - 1]; return { x: l.x, y: l.y };
  }

  /* ---------- distances ---------- */
  function dist(a, b, metric) {
    if (metric === 'L1') {
      const d = a.reduce((s, v, i) => s + Math.abs(v - b[i]), 0);
      return { d, expr: a.map((v, i) => `|${fmt(v)}−${fmt(b[i])}|`).join('+') };
    }
    const sq = a.reduce((s, v, i) => s + (v - b[i]) ** 2, 0);
    return { d: Math.sqrt(sq), sq, expr: '√(' + a.map((v, i) => `(${fmt(v)}−${fmt(b[i])})²`).join('+') + `) = √${fmt(sq)}` };
  }

  /* ---------- KNN ---------- */
  function knn(train, q, k, metric, zeroEps = 0.01) {
    const list = train.map((t, i) => ({ i, x: t.x, label: t.label, ...dist(q, t.x, metric) }))
      .sort((a, b) => a.d - b.d || a.i - b.i);
    const top = list.slice(0, k);
    const votes = {}, wvotes = {};
    top.forEach(n => { votes[n.label] = (votes[n.label] || 0) + 1; wvotes[n.label] = (wvotes[n.label] || 0) + 1 / Math.max(n.d, zeroEps); });
    const best = o => { const m = Math.max(...Object.values(o)); const w = Object.keys(o).filter(k => Math.abs(o[k] - m) < 1e-12); return { label: w.length > 1 ? null : w[0], tie: w }; };
    const boundaryTie = k < list.length && Math.abs(list[k - 1].d - list[k].d) < 1e-12;
    return { list, top, votes, wvotes, plain: best(votes), weighted: best(wvotes), boundaryTie };
  }

  /* ---------- entropy / IG ---------- */
  function entropy(counts) {
    const n = counts.reduce((a, b) => a + b, 0); if (!n) return 0;
    return counts.reduce((s, c) => c ? s - (c / n) * log2(c / n) : s, 0);
  }
  function entropyExpr(counts) {
    const n = counts.reduce((a, b) => a + b, 0);
    const parts = counts.filter(c => c).map(c => `(${c}/${n})·log₂(${c}/${n})`);
    if (parts.length <= 1) return '0';
    return '−' + parts.join(' − ');
  }
  function infoGain(data, featIdx, targetIdx, weightIdx = -1) {
    const w = r => weightIdx >= 0 ? parseNum(r[weightIdx]) : 1;
    const classes = [...new Set(data.map(r => r[targetIdx]))];
    const cnt = sub => classes.map(c => sub.filter(r => r[targetIdx] === c).reduce((s, r) => s + w(r), 0));
    const total = data.reduce((s, r) => s + w(r), 0);
    const HS = entropy(cnt(data));
    const values = [...new Set(data.map(r => r[featIdx]))];
    const parts = values.map(v => {
      const sub = data.filter(r => r[featIdx] === v); const c = cnt(sub); const n = c.reduce((a, b) => a + b, 0);
      return { v, counts: c, n, H: entropy(c), expr: entropyExpr(c) };
    });
    const cond = parts.reduce((s, p) => s + p.n / total * p.H, 0);
    return { classes, total, HS, HSexpr: entropyExpr(cnt(data)), rootCounts: cnt(data), parts, cond, ig: HS - cond };
  }

  /* ---------- Naive Bayes ---------- */
  function naiveBayes(data, headers, targetIdx, weightIdx, query, opt) {
    // query: {colIdx: value}; opt: {m, p (null=1/|V|), mode: 'zero'|'all'|'none'}
    const w = r => weightIdx >= 0 ? parseNum(r[weightIdx]) : 1;
    const classes = [...new Set(data.map(r => r[targetIdx]))];
    const total = data.reduce((s, r) => s + w(r), 0);
    const out = classes.map(c => {
      const sub = data.filter(r => r[targetIdx] === c); const nc = sub.reduce((s, r) => s + w(r), 0);
      const prior = nc / total;
      const terms = Object.entries(query).map(([fi, v]) => {
        fi = +fi;
        const nv = sub.filter(r => r[fi] === v).reduce((s, r) => s + w(r), 0);
        const V = new Set(data.map(r => r[fi])).size;
        const p = opt.p == null || opt.p === '' || isNaN(opt.p) ? 1 / V : +opt.p;
        const smooth = opt.mode === 'all' || (opt.mode === 'zero' && nv === 0);
        const prob = smooth ? (nv + opt.m * p) / (nc + opt.m) : nv / nc;
        return { f: headers[fi], v, nv, nc, prob, smooth, m: opt.m, p };
      });
      const score = terms.reduce((s, t) => s * t.prob, prior);
      return { c, nc, prior, terms, score };
    });
    const Z = out.reduce((s, o) => s + o.score, 0);
    out.forEach(o => o.post = Z ? o.score / Z : NaN);
    return { classes, total, out };
  }

  /* ---------- Perceptron ---------- */
  function perceptron(X, Y, opt) {
    // X: number[][], Y: bool, opt: {init:number[]|number, bias:bool, biasInit, epochs, rule:'ge'|'gt'}
    const d = X[0].length;
    let w = Array.isArray(opt.init) && opt.init.length === d ? [...opt.init] : Array(d).fill(+opt.init);
    if (opt.bias) w = [+opt.biasInit, ...w];
    const aug = x => opt.bias ? [1, ...x] : x;
    const pred = (w, x) => { const net = w.reduce((s, wi, i) => s + wi * x[i], 0); return { net, p: opt.rule === 'gt' ? net > 0 : net >= 0 }; };
    const steps = [];
    for (let e = 1; e <= opt.epochs; e++) {
      X.forEach((x0, i) => {
        const x = aug(x0); const { net, p } = pred(w, x); const before = [...w];
        let upd = 0; if (p && !Y[i]) upd = -1; else if (!p && Y[i]) upd = 1;
        if (upd) w = w.map((wi, j) => wi + upd * x[j]);

    TOPICS.forEach(t => { $('#' + t.id).hidden = t.id !== id; });
    $$('button', nav).forEach(b => b.setAttribute('aria-current', b.dataset.id === id));
    try { localStorage.setItem('ml-topic', id); } catch (e) { }
    if (location.hash.slice(1) !== id) history.replaceState(null, '', '#' + id);
  };
  nav.addEventListener('click', e => { const b = e.target.closest('button'); if (b) { show(b.dataset.id); if (window.innerWidth < 900) main.scrollIntoView({ block: 'start' }); } });
  let start = location.hash.slice(1); if (!start) { try { start = localStorage.getItem('ml-topic'); } catch (e) { } }
  show(start || TOPICS[0].id);
  window.addEventListener('hashchange', () => show(location.hash.slice(1)));
})();
</script>

</body></html>
